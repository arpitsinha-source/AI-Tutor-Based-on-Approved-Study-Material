<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create account · StudyMate AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">S</span> StudyMate
        <b>AI</b></a>
    <main class="auth-card"><a class="back-link" href="index.html">← Back to home</a>
        <h1>Create your account</h1>
        <p class="muted">Your personal study space starts here.</p>
        <form id="signup-form"><label>Full name<input id="fullName" autocomplete="name" maxlength="80"
                    required></label><label>Email address<input type="email" id="email" autocomplete="email"
                    required></label><label>Password<input type="password" id="password" autocomplete="new-password"
                    minlength="8" required></label><label>Confirm password<input type="password" id="confirmPassword"
                    autocomplete="new-password" minlength="8" required></label><button class="btn btn-primary btn-full"
                type="submit">Create account</button>
            <p class="form-status" id="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
